<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="clockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD"/>
      <stop offset="100%" style="stop-color:#BBDEFB"/>
    </linearGradient>
    <filter id="clockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#clockGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="30" r="50" fill="#2196F3" opacity="0.1"/>
  <circle cx="170" cy="170" r="70" fill="#64B5F6" opacity="0.1"/>
  
  <!-- Clock face -->
  <g transform="translate(100,100)" filter="url(#clockShadow)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="70" fill="white" stroke="#1976D2" stroke-width="4"/>
    
    <!-- Hour markers -->
    <g id="hourMarkers">
      <line x1="0" y1="-65" x2="0" y2="-55" stroke="#1976D2" stroke-width="3"/>
      <use href="#hourMarkers" transform="rotate(30)"/>
      <use href="#hourMarkers" transform="rotate(60)"/>
      <use href="#hourMarkers" transform="rotate(90)"/>
      <use href="#hourMarkers" transform="rotate(120)"/>
      <use href="#hourMarkers" transform="rotate(150)"/>
      <use href="#hourMarkers" transform="rotate(180)"/>
      <use href="#hourMarkers" transform="rotate(210)"/>
      <use href="#hourMarkers" transform="rotate(240)"/>
      <use href="#hourMarkers" transform="rotate(270)"/>
      <use href="#hourMarkers" transform="rotate(300)"/>
      <use href="#hourMarkers" transform="rotate(330)"/>
    </g>
    
    <!-- Clock hands -->
    <g id="hands">
      <!-- Hour hand -->
      <line x1="0" y1="0" x2="0" y2="-40" stroke="#1976D2" stroke-width="6" stroke-linecap="round" transform="rotate(45)"/>
      <!-- Minute hand -->
      <line x1="0" y1="0" x2="0" y2="-55" stroke="#1976D2" stroke-width="4" stroke-linecap="round" transform="rotate(180)"/>
      <!-- Second hand -->
      <line x1="0" y1="10" x2="0" y2="-60" stroke="#F44336" stroke-width="2" stroke-linecap="round" transform="rotate(90)"/>
      <!-- Center pin -->
      <circle cx="0" cy="0" r="4" fill="#1976D2"/>
    </g>
    
    <!-- Test paper overlay -->
    <g transform="translate(-25,-20)">
      <rect x="0" y="0" width="50" height="60" fill="white" stroke="#1976D2" stroke-width="1" rx="5"/>
      <line x1="10" y1="15" x2="40" y2="15" stroke="#666" stroke-width="1"/>
      <line x1="10" y1="25" x2="40" y2="25" stroke="#666" stroke-width="1"/>
      <line x1="10" y1="35" x2="40" y2="35" stroke="#666" stroke-width="1"/>
      <circle cx="5" cy="45" r="2" fill="#4CAF50"/>
    </g>
  </g>
</svg>