<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD"/>
      <stop offset="100%" style="stop-color:#BBDEFB"/>
    </linearGradient>
    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F5F5F5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main background -->
  <rect width="200" height="200" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="20" cy="20" r="40" fill="#2196F3" opacity="0.1"/>
  <circle cx="180" cy="180" r="60" fill="#64B5F6" opacity="0.1"/>
  
  <!-- Main paper stack -->
  <g transform="translate(40,30)" filter="url(#shadow)">
    <!-- Bottom paper -->
    <rect x="0" y="4" width="120" height="140" fill="#E1E1E1" rx="5"/>
    <!-- Middle paper -->
    <rect x="5" y="2" width="120" height="140" fill="#F5F5F5" rx="5"/>
    <!-- Top paper -->
    <rect x="10" y="0" width="120" height="140" fill="url(#paperGradient)" rx="5"/>
    
    <!-- MCQ content -->
    <g transform="translate(20,20)">
      <!-- Question 1 -->
      <circle cx="10" cy="10" r="6" fill="#4CAF50"/>
      <line x1="30" y1="10" x2="90" y2="10" stroke="#666" stroke-width="2"/>
      
      <!-- Question 2 -->
      <circle cx="10" cy="40" r="6" fill="#FF5722"/>
      <line x1="30" y1="40" x2="90" y2="40" stroke="#666" stroke-width="2"/>
      
      <!-- Question 3 -->
      <circle cx="10" cy="70" r="6" fill="none" stroke="#666" stroke-width="2"/>
      <line x1="30" y1="70" x2="90" y2="70" stroke="#666" stroke-width="2"/>
      
      <!-- Checkmark overlay -->
      <path d="M8,10 L12,14 L18,6" stroke="white" stroke-width="2" fill="none"/>
    </g>
  </g>
  
  <!-- Pencil -->
  <g transform="translate(140,120) rotate(-45)">
    <path d="M0,0 L80,0 L75,10 L5,10 Z" fill="#FFA726"/>
    <path d="M75,0 L80,0 L77.5,10 L75,10 Z" fill="#E65100"/>
    <path d="M0,0 L5,0 L5,10 L0,10 Z" fill="#FFD54F"/>
  </g>
</svg>